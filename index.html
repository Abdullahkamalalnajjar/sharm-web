<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5a9a0a" />
    <script>
      // Picked theme before the first paint (src/lib/theme.ts keeps it in sync).
      try {
        var t = localStorage.getItem('sharm-theme');
        t = t === 'dark' ? 'dark' : 'lime';
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#191717');
      } catch (e) {
        document.documentElement.dataset.theme = 'lime';
      }
    </script>
    <meta name="description" content="شرم: أكل، سوبر ماركت وصيدليات لحد باب البيت في شرم الشيخ" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>شرم</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
